# The ingestion endpoint must be reachable without dashboard credentials.
<Files "pms-telemetry-ingest.php">
    AuthType None
    Require all granted
</Files>

# Keep the human dashboard and its CSV exports behind Basic Authentication.
<Files "pms-telemetry.php">
    AuthType Basic
    AuthName "InnAware PMS Emulator Telemetry"
    AuthUserFile /etc/apache2/innaware-telemetry.htpasswd
    Require valid-user
</Files>

<FilesMatch "^(config.*\.php|schema\.sql)$">
    Require all denied
</FilesMatch>

SetEnv INNAWARE_TELEMETRY_CONFIG /etc/innaware/telemetry-config.php
LimitRequestBody 4096
