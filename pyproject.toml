[project]
name = "innaware-pms-emulator"
version = "0.1.0"
description = "InnAware UCP PMS and call-accounting integration emulator"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "jinja2>=3.1,<4",
  "pyserial-asyncio>=0.6,<1",
  "pydantic>=2.7,<3",
]

[project.scripts]
innaware-pms-emulator = "innaware_pms_emulator.main:run"

[tool.pytest.ini_options]
pythonpath = ["src"]
