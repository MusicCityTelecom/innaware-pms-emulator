[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "innaware-pms-emulator"
version = "0.3.6"
description = "Windows-first, cross-platform hotel PMS and call-accounting integration emulator"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Tommy Heggie" },
]
keywords = [
  "hospitality",
  "pms",
  "pbx",
  "fias",
  "call-accounting",
  "smdr",
  "telephony",
  "emulator",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Win32 (MS Windows)",
  "Framework :: FastAPI",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Communications :: Telephony",
]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pyserial-asyncio>=0.6,<1",
  "pydantic>=2.7,<3",
]

[project.optional-dependencies]
windows = [
  "pywebview>=5.4,<7",
]

[project.urls]
Homepage = "https://github.com/MusicCityTelecom/innaware-pms-emulator"
Repository = "https://github.com/MusicCityTelecom/innaware-pms-emulator"
Documentation = "https://github.com/MusicCityTelecom/innaware-pms-emulator#readme"
Issues = "https://github.com/MusicCityTelecom/innaware-pms-emulator/issues"

[project.scripts]
innaware-pms-emulator = "innaware_pms_emulator.main:run"
innaware-pms-emulator-windows = "innaware_pms_emulator.windows_launcher:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
