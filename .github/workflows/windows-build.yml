name: Windows Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - 'docs/**'
      - '*.md'
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  windows-build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact source checkout
        shell: pwsh
        run: |
          $expected = "${{ github.event.pull_request.head.sha || github.sha }}"
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $expected) {
            throw "Checkout SHA $actual does not match expected exact source SHA $expected"
          }
          "EXACT_SOURCE_SHA=$actual" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build Windows field product
        shell: pwsh
        run: ./scripts/build-windows.ps1 -Python python

      - name: Test installer, reinstall, and uninstall
        shell: pwsh
        run: ./scripts/smoke-installer.ps1

      - name: Read canonical application version
        shell: pwsh
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Verify canonical release manifest
        shell: pwsh
        run: |
          $manifest = Get-Content release-manifest.json -Raw | ConvertFrom-Json
          $pack = Get-Content protocol-pack.json -Raw | ConvertFrom-Json
          $expectedTag = "v$env:APP_VERSION"

          if ($manifest.application_version -ne $env:APP_VERSION) {
            throw "release-manifest.json application_version $($manifest.application_version) does not match pyproject.toml $env:APP_VERSION"
          }
          if ($manifest.release_tag -ne $expectedTag) {
            throw "release-manifest.json release_tag $($manifest.release_tag) does not match $expectedTag"
          }
          if ($manifest.protocol_pack_version -ne $pack.pack_version) {
            throw "release-manifest.json protocol_pack_version $($manifest.protocol_pack_version) does not match protocol-pack.json $($pack.pack_version)"
          }
          if ($manifest.repository -ne "MusicCityTelecom/innaware-pms-emulator") {
            throw "release-manifest.json repository is not the canonical GitHub repository"
          }
          if ($manifest.update_source -ne "https://github.com/MusicCityTelecom/innaware-pms-emulator/releases") {
            throw "release-manifest.json update_source is not the canonical GitHub Releases URL"
          }

          $notes = "docs/RELEASE_NOTES_$env:APP_VERSION.md"
          if (-not (Test-Path $notes)) {
            throw "Missing release notes: $notes"
          }

          "RELEASE_TAG=$($manifest.release_tag)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "RELEASE_PUBLISH=$($manifest.publish.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_ENV -Append
          "RELEASE_PRERELEASE=$($manifest.prerelease.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_ENV -Append
          "RELEASE_MAKE_LATEST=$($manifest.make_latest.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_ENV -Append
          "RELEASE_NOTES_PATH=$notes" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build sanitized protocol pack
        shell: pwsh
        run: python scripts/build-protocol-pack.py

      - name: Build exact-SHA interop evidence pack
        shell: pwsh
        run: |
          $evidence = "InnAware-PMS-Interop-Evidence-$env:EXACT_SOURCE_SHA.json"
          $checksum = "$evidence.sha256.txt"
          python scripts/build-interop-evidence-pack.py --source-sha "$env:EXACT_SOURCE_SHA" --output $evidence
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          $digest = (Get-FileHash -Algorithm SHA256 $evidence).Hash.ToLowerInvariant()
          "$digest  $evidence" | Set-Content -Path $checksum -Encoding ascii

      - name: Verify complete release asset set
        shell: pwsh
        run: python scripts/verify-release-assets.py --source-sha "$env:EXACT_SOURCE_SHA"

      - name: Upload Windows product artifact
        uses: actions/upload-artifact@v4
        with:
          name: innaware-pms-emulator-windows-${{ env.APP_VERSION }}
          path: |
            dist-windows/InnAware-PMS-Emulator.exe
            dist-windows/InnAware-PMS-Emulator-Setup.exe
            dist-windows/README-WINDOWS.txt
            dist-windows/PRIVACY-TELEMETRY.md
            dist-windows/SHA256SUMS.txt
            dist-windows/build-info.json
            release-assets-*.json
            release-assets-*.json.sha256.txt
            InnAware-PMS-Emulator-Windows-${{ env.APP_VERSION }}.zip
            InnAware-PMS-Emulator-Source-${{ env.APP_VERSION }}.zip
            SHA256SUMS-WINDOWS-${{ env.APP_VERSION }}.txt
            InnAware-PMS-Protocol-Pack-*.zip
            InnAware-PMS-Protocol-Pack-*.sha256.txt
            InnAware-PMS-Interop-Evidence-*.json
            InnAware-PMS-Interop-Evidence-*.json.sha256.txt
            release-manifest.json
          if-no-files-found: error
          retention-days: 30

      - name: Ensure canonical release tag targets this build
        if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && env.RELEASE_PUBLISH == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/prepare-release.ps1

      - name: Verify tag matches application version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -ne $env:RELEASE_TAG) {
            throw "Release tag $tag does not match canonical manifest tag $env:RELEASE_TAG"
          }
          if ($tag -ne "v$env:APP_VERSION") {
            throw "Release tag $tag does not match application version v$env:APP_VERSION"
          }

      - name: Publish GitHub release
        if: env.RELEASE_ALLOWED == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: InnAware PMS Emulator ${{ env.RELEASE_TAG }}
          body_path: ${{ env.RELEASE_NOTES_PATH }}
          prerelease: ${{ env.RELEASE_PRERELEASE == 'true' }}
          make_latest: ${{ env.RELEASE_MAKE_LATEST }}
          fail_on_unmatched_files: true
          files: |
            dist-windows/InnAware-PMS-Emulator-Setup.exe
            dist-windows/InnAware-PMS-Emulator.exe
            dist-windows/README-WINDOWS.txt
            dist-windows/PRIVACY-TELEMETRY.md
            InnAware-PMS-Emulator-Windows-${{ env.APP_VERSION }}.zip
            InnAware-PMS-Emulator-Source-${{ env.APP_VERSION }}.zip
            dist-windows/SHA256SUMS.txt
            dist-windows/build-info.json
            release-assets-*.json
            release-assets-*.json.sha256.txt
            SHA256SUMS-WINDOWS-${{ env.APP_VERSION }}.txt
            InnAware-PMS-Protocol-Pack-*.zip
            InnAware-PMS-Protocol-Pack-*.sha256.txt
            InnAware-PMS-Interop-Evidence-*.json
            InnAware-PMS-Interop-Evidence-*.json.sha256.txt
            release-manifest.json
